<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivy — ta coach d'anglais</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --ink:#16261F;
    --forest:#1F3B2C;
    --forest-light:#2E5340;
    --sand:#EFE7D8;
    --sand-card:#F8F4EA;
    --coral:#E0654B;
    --coral-soft:#F4CFC2;
    --line: rgba(22,38,31,0.12);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--sand);
    color: var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    background: var(--sand-card);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  /* Header */
  header{
    padding:20px 20px 16px;
    background: var(--forest);
    color: var(--sand-card);
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
  }

  .avatar-wrap{
    width:56px;height:56px;flex-shrink:0;
    border-radius:50%;
    background: var(--coral);
    display:flex;align-items:center;justify-content:center;
    border:2px solid rgba(255,255,255,0.35);
  }

  header .titles{flex:1; min-width:0;}
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.3rem;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    font-size:0.82rem;
    opacity:0.8;
  }

  .level-row{
    display:flex;
    gap:6px;
    padding:12px 20px;
    background: var(--sand);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .level-btn{
    border:1px solid var(--line);
    background: var(--sand-card);
    color: var(--ink);
    padding:6px 12px;
    border-radius:20px;
    font-size:0.78rem;
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition: all .15s ease;
  }
  .level-btn.active{
    background: var(--forest);
    color:#fff;
    border-color: var(--forest);
  }

  /* Chat */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:14px;
    font-size:0.93rem;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.tutor{
    align-self:flex-start;
    background:#fff;
    border:1px solid var(--line);
    border-top-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;
    background: var(--forest);
    color:#fff;
    border-top-right-radius:4px;
  }
  .msg.typing{
    align-self:flex-start;
    background:#fff;
    border:1px solid var(--line);
    border-top-left-radius:4px;
    color:#8a8a80;
    font-style:italic;
    font-size:0.85rem;
  }

  .msg .en{ color: var(--forest-light); font-weight:600; }
  .msg .correction{ color: var(--coral); }

  /* Input */
  .input-row{
    display:flex;
    gap:8px;
    padding:14px 16px;
    border-top:1px solid var(--line);
    background: var(--sand-card);
  }
  .input-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:22px;
    padding:11px 16px;
    font-size:0.93rem;
    font-family:'Work Sans', sans-serif;
    background:#fff;
    color: var(--ink);
    outline:none;
  }
  .input-row input:focus{ border-color: var(--forest); }

  .send-btn{
    border:none;
    background: var(--coral);
    color:#fff;
    width:44px;height:44px;
    border-radius:50%;
    flex-shrink:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition: transform .1s ease;
  }
  .send-btn:active{ transform: scale(0.92); }
  .send-btn:disabled{ opacity:0.4; cursor:default; }

  .reset-btn{
    background:none;
    border:none;
    color: rgba(255,255,255,0.75);
    font-size:0.72rem;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    align-self:flex-start;
    margin-top:4px;
  }

  .empty-hint{
    text-align:center;
    color:#8a8a80;
    font-size:0.85rem;
    margin-top:30px;
    padding:0 20px;
    line-height:1.6;
  }

  .mic-btn{
    border:none;
    background: var(--forest);
    color:#fff;
    width:44px;height:44px;
    border-radius:50%;
    flex-shrink:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition: transform .1s ease, background .2s ease;
  }
  .mic-btn.listening{
    background: var(--coral);
    animation: pulse 1.1s infinite;
  }
  .mic-btn:disabled{ opacity:0.3; cursor:not-allowed; }

  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(224,101,75,0.5); }
    70%{ box-shadow: 0 0 0 10px rgba(224,101,75,0); }
    100%{ box-shadow: 0 0 0 0 rgba(224,101,75,0); }
  }

  .speaker-toggle{
    background:none;
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    border-radius:16px;
    padding:4px 10px;
    font-size:0.7rem;
    cursor:pointer;
    flex-shrink:0;
    font-family:'Work Sans', sans-serif;
  }
  .speaker-toggle.off{ opacity:0.5; }

  .voice-warning{
    font-size:0.72rem;
    color:#8a8a80;
    text-align:center;
    padding:6px 20px 0;
  }

  .avatar-wrap.speaking{
    box-shadow: 0 0 0 4px rgba(224,101,75,0.3);
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar-wrap" id="avatarWrap">
      <svg id="avatarSvg" width="34" height="34" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="17" fill="#F8F4EA"/>
        <circle cx="11.5" cy="15" r="2.2" fill="#1F3B2C"/>
        <circle cx="22.5" cy="15" r="2.2" fill="#1F3B2C"/>
        <path id="mouthPath" d="M11 21 Q17 26 23 21" stroke="#1F3B2C" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="titles">
      <h1>Ivy</h1>
      <p>Ta coach d'anglais, à ton rythme</p>
    </div>
    <button class="speaker-toggle" id="speakerToggle">🔊 Voix : ON</button>
  </header>
  <div class="voice-warning" id="voiceWarning" style="display:none;"></div>

  <div class="level-row" id="levelRow">
    <button class="level-btn active" data-level="debutant">Débutant</button>
    <button class="level-btn" data-level="faux-debutant">Faux débutant</button>
    <button class="level-btn" data-level="intermediaire">Intermédiaire</button>
  </div>

  <div class="chat" id="chat">
    <div class="empty-hint">
      Dis simplement bonjour à Ivy pour commencer — en français ou en anglais, comme tu veux.<br><br>
      <button class="reset-btn" id="resetBtn" style="color:#8a8a80;">Recommencer la conversation</button>
    </div>
  </div>

  <div class="input-row">
    <button class="mic-btn" id="micBtn" aria-label="Parler">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="white" stroke-width="1.8"/>
        <path d="M6 11a6 6 0 0 0 12 0M12 19v3" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <input type="text" id="userInput" placeholder="Écris ou appuie sur le micro…" autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Envoyer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="white"/>
      </svg>
    </button>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const levelRow = document.getElementById('levelRow');
const mouthPath = document.getElementById('mouthPath');
const resetBtn = document.getElementById('resetBtn');

let level = 'debutant';
let history = [];
let isTyping = false;

const levelLabels = {
  'debutant': 'débutant (A1) : phrases très simples, présent, vocabulaire du quotidien',
  'faux-debutant': 'faux débutant (A2) : bases connues mais fragiles, un peu de passé et futur',
  'intermediaire': 'intermédiaire (B1) : conversations plus longues, plusieurs temps, nuances'
};

function systemPrompt(){
  return `Tu es Ivy, une coach d'anglais chaleureuse, patiente et encourageante pour une personne francophone dont le niveau d'anglais est ${levelLabels[level]}.

Règles :
- Réponds TOUJOURS en mélangeant français et anglais : donne l'explication ou la consigne en français, et propose la phrase ou le mot à pratiquer en anglais.
- Encadre chaque expression anglaise à retenir entre balises <en>...</en>.
- Si l'utilisateur écrit en anglais et fait une erreur, corrige-la avec bienveillance, sans le reprendre sur tout : encadre la correction entre balises <fix>...</fix>, explique brièvement pourquoi en français, puis continue la conversation.
- Ne donne jamais un cours magistral long : 3 à 5 phrases maximum par réponse, puis pose une question ou propose un petit exercice pour faire parler l'utilisateur.
- Adapte la difficulté du vocabulaire et de la grammaire au niveau indiqué. Ne va jamais plus vite que ce niveau.
- Reste toujours positive et valorisante, même face aux erreurs — l'objectif est que l'utilisateur ose parler.
- Si l'utilisateur ne répond qu'en français, encourage-le gentiment à essayer quelques mots en anglais, sans insister lourdement.
- Ne mentionne jamais que tu es une IA, un modèle de langage ou un prompt système.`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTutorText(raw){
  let safe = escapeHtml(raw);
  safe = safe.replace(/&lt;en&gt;(.*?)&lt;\/en&gt;/gs, '<span class="en">$1</span>');
  safe = safe.replace(/&lt;fix&gt;(.*?)&lt;\/fix&gt;/gs, '<span class="correction">✎ $1</span>');
  return safe;
}

function extractEnglishPhrases(raw){
  const matches = [...raw.matchAll(/<en>(.*?)<\/en>/gs)];
  return matches.map(m => m[1]);
}

/* ---------- Voix ---------- */
const avatarWrap = document.getElementById('avatarWrap');
const speakerToggle = document.getElementById('speakerToggle');
const micBtn = document.getElementById('micBtn');
const voiceWarning = document.getElementById('voiceWarning');

let voiceOn = true;
let englishVoice = null;

function pickEnglishVoice(){
  const voices = speechSynthesis.getVoices();
  englishVoice = voices.find(v => /en-GB/i.test(v.lang)) ||
                 voices.find(v => /en-US/i.test(v.lang)) ||
                 voices.find(v => /^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickEnglishVoice;
  pickEnglishVoice();
} else {
  speakerToggle.style.display = 'none';
}

speakerToggle.addEventListener('click', () => {
  voiceOn = !voiceOn;
  speakerToggle.textContent = voiceOn ? '🔊 Voix : ON' : '🔇 Voix : OFF';
  speakerToggle.classList.toggle('off', !voiceOn);
  if(!voiceOn) speechSynthesis.cancel();
});

function speakPhrases(phrases){
  if(!voiceOn || !('speechSynthesis' in window) || phrases.length === 0) return;
  speechSynthesis.cancel();
  let i = 0;
  function next(){
    if(i >= phrases.length){
      avatarWrap.classList.remove('speaking');
      setMouth('idle');
      return;
    }
    const utter = new SpeechSynthesisUtterance(phrases[i]);
    if(englishVoice) utter.voice = englishVoice;
    utter.lang = 'en-US';
    utter.rate = 0.92;
    utter.onstart = () => { avatarWrap.classList.add('speaking'); setMouth('talk'); };
    utter.onend = () => { i++; next(); };
    speechSynthesis.speak(utter);
  }
  next();
}

/* ---------- Micro (reconnaissance vocale) ---------- */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'fr-FR';

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    inputEl.value = transcript;
    sendMessage();
  };
  recognition.onerror = () => {
    listening = false;
    micBtn.classList.remove('listening');
    voiceWarning.style.display = 'block';
    voiceWarning.textContent = "Je n'ai pas réussi à t'entendre — réessaie ou écris ton message.";
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
  };

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
      return;
    }
    voiceWarning.style.display = 'none';
    try{
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
    }catch(err){
      voiceWarning.style.display = 'block';
      voiceWarning.textContent = "Le micro n'a pas pu démarrer. Vérifie que tu as autorisé l'accès au micro.";
    }
  });
} else {
  micBtn.disabled = true;
  voiceWarning.style.display = 'block';
  voiceWarning.textContent = "La reconnaissance vocale n'est pas disponible sur ce navigateur — utilise le clavier, Ivy pourra quand même te parler.";
}

function addMessage(role, text){
  const hint = chatEl.querySelector('.empty-hint');
  if(hint) hint.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role === 'tutor'){
    div.innerHTML = renderTutorText(text);
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function setMouth(state){
  if(state === 'talk'){
    mouthPath.setAttribute('d', 'M11 22 Q17 24 23 22 Q17 27 11 22');
  } else if(state === 'think'){
    mouthPath.setAttribute('d', 'M12 22 Q17 22 22 22');
  } else {
    mouthPath.setAttribute('d', 'M11 21 Q17 26 23 21');
  }
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || isTyping) return;

  addMessage('user', text);
  history.push({role:'user', content:text});
  inputEl.value='';
  isTyping = true;
  sendBtn.disabled = true;
  setMouth('think');

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg typing';
  typingDiv.textContent = 'Ivy réfléchit…';
  chatEl.appendChild(typingDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt(),
        messages: history
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const reply = textBlock ? textBlock.text : "Désolée, je n'ai pas pu répondre — réessaie.";

    typingDiv.remove();
    addMessage('tutor', reply);
    history.push({role:'assistant', content:reply});
    speakPhrases(extractEnglishPhrases(reply));
  }catch(err){
    typingDiv.remove();
    addMessage('tutor', "Petit souci de connexion — tu peux réessayer ?");
    setMouth('idle');
  }finally{
    isTyping = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });

levelRow.addEventListener('click', e => {
  const btn = e.target.closest('.level-btn');
  if(!btn) return;
  levelRow.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  level = btn.dataset.level;
});

resetBtn.addEventListener('click', () => {
  history = [];
  chatEl.innerHTML = `<div class="empty-hint">
      Dis simplement bonjour à Ivy pour commencer — en français ou en anglais, comme tu veux.<br><br>
      <button class="reset-btn" id="resetBtn2" style="color:#8a8a80;">Recommencer la conversation</button>
    </div>`;
  document.getElementById('resetBtn2').addEventListener('click', () => resetBtn.click());
});
</script>

</body>
</html>
